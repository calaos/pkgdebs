name: Build manual deb

on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: 'Package name'
        required: true
        type: choice
        default: 'calaos-server'
        # No calaos-meta: only release_calaos_os.yml publishes it, with its pins.
        options:
          - calaos-keyring
          - calaos-server
          - calaos-web-app
          - calaos-home
          - grafana
          - influxdb
          - mosquitto
          - haproxy
          - zigbee2mqtt
          - hue2mqtt
          - envoy
      version:
        description: 'Package version'
        required: true
      image_src:
        description: 'Image source (empty only for a package without an image)'
        required: false
      prerelease:
        description: 'Is this a prerelease?'
        required: true
        type: boolean
  

permissions:
  contents: read

jobs:
  buildEvent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the payload
        env:
          PKGNAME: ${{ github.event.inputs.pkgname }}
          VERSION: ${{ github.event.inputs.version }}
          IMAGE_SRC: ${{ github.event.inputs.image_src }}
        run: ./validate_dispatch --image-required "$PKGNAME" "$VERSION" "$IMAGE_SRC"

      - name: Build the deb
        env:
          PKGNAME: ${{ github.event.inputs.pkgname }}
          VERSION: ${{ github.event.inputs.version }}
          IMAGE_SRC: ${{ github.event.inputs.image_src }}
        run: make "build-$PKGNAME" PKGVERSION="$VERSION" IMAGE_SRC="$IMAGE_SRC"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: pkg/*.deb

      - name: Create a Release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.CALAOS_REL_TOKEN }}
          tag: ${{ github.event.inputs.pkgname }}-${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.pkgname }} - ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
          files: pkg/*.deb
          gzip: false

      - name: Update repo cache
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: ${{ secrets.DEB_REPO_WEBHOOK_URL }}
          webhook_secret: ${{ secrets.DEB_REPO_WEBHOOK_SECRET }}
