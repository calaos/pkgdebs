name: Repository Dispatch

on:
  repository_dispatch:
    types: [build_deb]

permissions:
  contents: read

jobs:
  buildEvent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the payload
        env:
          PKGNAME: ${{ github.event.client_payload.pkgname }}
          VERSION: ${{ github.event.client_payload.version }}
          IMAGE_SRC: ${{ github.event.client_payload.image_src }}
        run: ./validate_dispatch --image-required "$PKGNAME" "$VERSION" "$IMAGE_SRC"

      - name: Build the deb
        env:
          PKGNAME: ${{ github.event.client_payload.pkgname }}
          VERSION: ${{ github.event.client_payload.version }}
          IMAGE_SRC: ${{ github.event.client_payload.image_src }}
        run: make "build-$PKGNAME" PKGVERSION="$VERSION" IMAGE_SRC="$IMAGE_SRC"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: pkg/*.deb

      - name: Create a Release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.CALAOS_REL_TOKEN }}
          tag: ${{ github.event.client_payload.pkgname }}-${{ github.event.client_payload.version }}
          name: ${{ github.event.client_payload.pkgname }} - ${{ github.event.client_payload.version }}
          prerelease: ${{ github.event.client_payload.prerelease == true }}
          files: pkg/*.deb
          gzip: false

      - name: Update repo cache
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: ${{ secrets.DEB_REPO_WEBHOOK_URL }}
          webhook_secret: ${{ secrets.DEB_REPO_WEBHOOK_SECRET }}
